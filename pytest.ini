[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . src

addopts = -v --tb=short
markers =
    benchmark: performance and execution speed benchmark tests
    gui: tests requiring graphical display
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning